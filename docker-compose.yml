# Dev-only infrastructure: Postgres + Redis.
# Backend, Celery worker, and frontend are run locally (see README.md) so an
# AI coding agent can iterate on them without rebuilding containers.
services:
  postgres:
    image: postgres:16-alpine
    container_name: study_recoverai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Walchand%40123
      POSTGRES_DB: study_recoverai
    ports:
      - "5432:5432"
    volumes:
      - study_recoverai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoverai -d recoverai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: study_recoverai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  study_recoverai_postgres_data:
